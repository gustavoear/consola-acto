<title>Consola del acto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
/*CSS_PANTALLA*/

/* ===== Pantalla del proyector: capas de contenido ===== */
body.pantalla { overflow: hidden; background: #000; }
[hidden] { display: none !important; }
.media { background: #000; overflow: hidden; }
.media .blur { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(40px) brightness(.45) saturate(1.1); }
.media .main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
/* llenar pantalla: ocupa todo y recorta lo que sobra (por ejemplo, un video 16:9 en un proyector 4:3) */
.media.cover .main { object-fit: cover; }
.media.cover .blur { display: none; }
/* fondos agregados: las imágenes se acercan muy despacio para que no se vean quietas */
.bgm.on img.kb { animation: kbBg 40s ease-in-out infinite alternate; }
@keyframes kbBg { from { transform: scale(1); } to { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .bgm.on img.kb { animation: none; } }
#sN { background: #000; }
.arranque { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 6vw;
  background: rgba(4,8,18,.82); color: var(--text); font: 500 clamp(16px, 2.6vmin, 30px)/1.5 system-ui, sans-serif; z-index: 10; cursor: pointer; }
.arranque strong { display: block; font-family: var(--display); color: var(--gold); font-size: 1.6em; letter-spacing: .08em; margin-bottom: .6em; }
.arranque small { display: block; opacity: .7; margin-top: 1em; font-size: .7em; }
body.listo .arranque { display: none; }

/* ===== Consola ===== */
/* Layout: barra superior; columna principal con "al aire", "siguiente" y el programa; columna lateral con fondos, música, volumen y atajos */
body.consola {
  --c-bg: #0b0f17;       /* fondo azul muy oscuro, para sala a oscuras */
  --c-panel: #131a27;    /* paneles */
  --c-raise: #1a2334;    /* filas y botones */
  --c-line: #26314a;     /* bordes */
  --c-text: #e7ebf2;     /* texto */
  --c-mute: #8d98ad;     /* texto secundario */
  --c-gold: #e2b85c;     /* acento de marca, "siguiente" */
  --c-air: #ef4d56;      /* al aire */
  --c-ok: #3fb06a;       /* conectado */
  --c-warn: #f0a43a;     /* atención */
  --ui: system-ui, "Cantarell", "Noto Sans", "Segoe UI", sans-serif;
  overflow: auto; height: auto; min-height: 100%; background: var(--c-bg); color: var(--c-text);
  font: 14px/1.45 var(--ui); padding-inline: 16px; padding-block: 12px 24px; box-sizing: border-box;
}
body.consola [hidden] { display: none !important; }
body.consola *, body.consola *::before, body.consola *::after { box-sizing: border-box; }
.c-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 4px 12px; border-bottom: 1px solid var(--c-line); }
.c-brand { font-family: var(--display); font-weight: 700; letter-spacing: .06em; font-size: 18px; color: var(--c-gold); margin: 0; margin-right: auto; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--c-raise);
  border: 1px solid var(--c-line); font-weight: 600; font-size: 13px; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c-mute); }
.pill.ok::before { background: var(--c-ok); box-shadow: 0 0 8px var(--c-ok); }
.pill.warn { border-color: var(--c-warn); color: var(--c-warn); }
.pill.warn::before { background: var(--c-warn); }
.btn { font: 600 13px/1 var(--ui); color: var(--c-text); background: var(--c-raise); border: 1px solid var(--c-line);
  border-radius: 8px; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #3a4a6a; background: #202b40; }
.btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.btn:focus-visible, .c-row:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--c-gold); outline-offset: 2px; }
.btn.prim { background: var(--c-gold); color: #1a1406; border-color: var(--c-gold); }
.btn.prim:hover { background: #ecc779; }
.btn.on { border-color: var(--c-gold); color: var(--c-gold); }
.btn.air { border-color: var(--c-air); color: #fff; background: rgba(239,77,86,.18); }
.c-grid { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 16px; margin-top: 14px; align-items: start; }
@media (max-width: 980px) { .c-grid { grid-template-columns: minmax(0, 1fr); } }
.c-col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--c-panel); border: 1px solid var(--c-line); border-radius: 12px; padding: 14px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--c-mute); font-weight: 700; }
.c-now { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr) minmax(170px, .55fr); gap: 14px; margin-top: 14px; }
@media (max-width: 1100px) { .c-now { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 720px) { .c-now { grid-template-columns: minmax(0, 1fr); } }
/* la franja queda fija al bajar por el programa; solo en pantallas anchas y altas, donde no tapa la lista */
@media (min-width: 1101px) and (min-height: 600px) {
  .c-now { position: sticky; top: 0; z-index: 3; background: var(--c-bg); margin-top: 2px; padding-block: 12px;
    box-shadow: 0 10px 14px -12px rgba(0,0,0,.8); }
  .c-grid { margin-top: 2px; }
}
.onair { border-color: rgba(239,77,86,.55); }
.onair h2 { color: var(--c-air); }
.big-name { font-size: 20px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
.sub { color: var(--c-mute); font-size: 13px; margin: 2px 0 0; }
/* miniatura y nombre de lo que está al aire y de lo que sigue */
.now-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.now-row .thumb { flex: none; }
.now-row .thumb.grande { width: 120px; font-size: 26px; }
.now-txt { min-width: 0; flex: 1; }
.bar { height: 8px; background: var(--c-raise); border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--c-air); border-radius: 99px; transition: width .25s linear; }
/* barra para desplazarse: zona de clic alta, barra fina que crece al pasar el mouse */
.seek { position: relative; margin-top: 6px; padding-block: 8px; cursor: default; touch-action: none; user-select: none; }
.seek .bar { margin-top: 0; overflow: visible; position: relative; transition: height .15s; }
.seek .bar i { position: relative; }
.seek.can { cursor: pointer; }
.seek.can:hover .bar, .seek.drag .bar { height: 12px; }
.seek.can .bar i::after { content: ""; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); opacity: 0; transition: opacity .15s; }
.seek.can:hover .bar i::after, .seek.drag .bar i::after { opacity: 1; }
.seek.drag .bar i { transition: none; }
.seek .tip { position: absolute; bottom: 100%; transform: translateX(-50%); background: #000; color: #fff; font: 700 12px/1 var(--ui);
  font-variant-numeric: tabular-nums; padding: 5px 7px; border-radius: 6px; pointer-events: none; opacity: 0; white-space: nowrap; }
.seek.can:hover .tip, .seek.drag .tip { opacity: 1; }
.times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; margin-top: 6px; font-size: 13px; color: var(--c-mute); }
.times b { color: var(--c-text); font-size: 22px; font-weight: 700; }
.nextp { border-color: rgba(226,184,92,.5); }
.nextp h2 { color: var(--c-gold); }
.kbd { display: inline-block; min-width: 24px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--c-line);
  border-bottom-width: 3px; background: var(--c-raise); font: 700 12px/1.4 var(--ui); text-align: center; color: var(--c-text); }
.load { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.load label.btn input { display: none; }
.drop { border: 2px dashed var(--c-line); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--c-mute); margin-top: 10px; }
.drop.over { border-color: var(--c-gold); color: var(--c-gold); }
.list { display: grid; gap: 6px; margin-top: 10px; }
.c-row { display: grid; grid-template-columns: 34px 72px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--c-raise); border: 1px solid var(--c-line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.c-row.sel { border-color: var(--c-gold); background: #262a2a; box-shadow: inset 0 0 0 1px var(--c-gold); }
.c-row.live { border-color: var(--c-air); background: #2a1a20; }
.c-row .n { color: var(--c-mute); font-variant-numeric: tabular-nums; text-align: center; font-weight: 600; }
@media (max-width: 640px) { .c-row { grid-template-columns: 34px 56px minmax(0, 1fr); } .c-row .acts { grid-column: 1 / -1; justify-content: flex-end; } .thumb { width: 56px; } }
.thumb { width: 72px; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; background: #000 center / cover no-repeat;
  display: grid; place-items: center; color: var(--c-mute); font-size: 20px; overflow: hidden; }
.meta { min-width: 0; display: grid; gap: 4px; }
.meta input.name { width: 100%; font: 600 14px/1.3 var(--ui); color: var(--c-text); background: transparent; border: 1px solid transparent;
  border-radius: 6px; padding: 3px 6px; margin-left: -6px; }
.meta input.name:hover { border-color: var(--c-line); }
.meta input.name:focus { background: var(--c-bg); border-color: var(--c-gold); outline: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--c-mute); font-size: 12px; }
.tag { padding: 1px 7px; border-radius: 99px; border: 1px solid var(--c-line); font-weight: 600; }
.tag.live { color: #fff; background: var(--c-air); border-color: var(--c-air); }
.tag.next { color: #1a1406; background: var(--c-gold); border-color: var(--c-gold); }
.tags select, .tags .tog { font: 12px var(--ui); color: var(--c-text); background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 6px; padding: 3px 6px; cursor: pointer; }
.tags .fname { font-size: 11px; color: var(--c-mute); opacity: .8; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags .tog.off { color: var(--c-warn); border-color: rgba(240,164,58,.5); }
.tags .tog.rep { color: var(--c-gold); border-color: rgba(226,184,92,.6); }
.acts { display: flex; gap: 4px; align-items: center; }
.acts .btn { padding: 7px 9px; }
.empty { color: var(--c-mute); padding: 6px 2px; }
.bgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bgs .wide { grid-column: 1 / -1; }
.bgload { margin-top: 10px; }
.bgload .btn { padding: 8px 10px; font-size: 12px; }
#bgPanel.over { border-color: var(--c-gold); box-shadow: inset 0 0 0 1px var(--c-gold); }
.bglist { display: grid; gap: 5px; margin-top: 10px; }
.bgrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px;
  background: var(--c-raise); border: 1px solid var(--c-line); border-radius: 9px; }
.bgrow.live { border-color: var(--c-air); background: #2a1a20; }
.bgrow.out .bgpick { opacity: .55; }
.bgpick { display: contents; cursor: pointer; }
.bgthumb { width: 52px; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 5px; background: #0a1430 center / contain no-repeat; cursor: pointer;
  display: grid; place-items: center; font: 700 11px/1 var(--display); color: var(--c-gold); overflow: hidden; }
.bgname { min-width: 0; cursor: pointer; display: grid; gap: 2px; }
.bgname b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bgname small { color: var(--c-mute); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bgname small .tag { padding: 0 6px; font-size: 10px; }
.bgacts { display: flex; gap: 3px; }
.bgacts .btn { padding: 5px 7px; font-size: 12px; }
.bgacts .rot[aria-pressed="true"] { color: var(--c-gold); border-color: rgba(226,184,92,.6); }
.bgacts .rot[aria-pressed="false"] { color: var(--c-mute); }
.timing { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--c-line); font-size: 13px; }
.timing label { color: var(--c-mute); }
.step { display: flex; align-items: center; gap: 4px; }
.step .btn { padding: 6px 10px; font-size: 15px; }
.step input { width: 58px; text-align: right; font: 700 15px/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--c-text);
  background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 6px; padding: 6px; -moz-appearance: textfield; }
.step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.step span { color: var(--c-mute); margin-right: 2px; }
.nextchg { grid-column: 1 / -1; margin: 2px 0 0; color: var(--c-mute); font-variant-numeric: tabular-nums; }
.nextchg b { color: var(--c-gold); }
.vol { display: flex; align-items: center; gap: 10px; }
.vol input { flex: 1; min-width: 0; accent-color: var(--c-gold); }
.vol b { font-variant-numeric: tabular-nums; width: 44px; text-align: right; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 10px; align-items: center; font-size: 13px; margin: 0; }
.keys dd { margin: 0; color: var(--c-mute); }
.c-toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 10px); background: var(--c-gold); color: #1a1406;
  font-weight: 700; padding: 10px 16px; border-radius: 999px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 5; }
.c-toast.show { opacity: 1; transform: translate(-50%, 0); }
.c-toast.bad { background: var(--c-air); color: #fff; }
.help { color: var(--c-mute); font-size: 13px; margin: 8px 0 0; }
.bgempty { color: var(--c-mute); font-size: 13px; margin: 10px 0 0; padding: 12px; border: 1px dashed var(--c-line); border-radius: 8px; }
/* créditos: se despliegan al tocar "Acerca de" */
.creditos summary { cursor: pointer; list-style: none; }
.creditos summary::-webkit-details-marker { display: none; }
.creditos summary h2 { display: inline; margin: 0; }
.creditos summary::after { content: " ▸"; color: var(--c-mute); font-size: 11px; }
.creditos details[open] summary::after { content: " ▾"; }
.creditos p { color: var(--c-mute); font-size: 13px; line-height: 1.5; margin: 8px 0 0; }
.creditos p b { color: var(--c-text); }
.creditos a { color: var(--c-gold); overflow-wrap: anywhere; }
</style>

<template id="tplPantalla">
<section class="scene media" id="sM1"><img class="blur" alt=""><img class="main" alt=""><video class="main" playsinline preload="auto"></video></section>
<section class="scene media" id="sM2"><img class="blur" alt=""><img class="main" alt=""><video class="main" playsinline preload="auto"></video></section>
<section class="scene media bgm" id="sU1"><img class="blur" alt=""><img class="main" alt=""><video class="main" playsinline muted loop preload="auto"></video></section>
<section class="scene media bgm" id="sU2"><img class="blur" alt=""><img class="main" alt=""><video class="main" playsinline muted loop preload="auto"></video></section>
<section class="scene" id="sN" aria-label="Negro"></section>
<audio id="mus" preload="auto"></audio>
<div class="arranque" id="arranque"><div><strong>Pantalla del proyector</strong><span id="arrTxt">Hacé clic acá una vez para activar el sonido y la pantalla completa.</span><small>Si esta ventana no está en el proyector, movela con Super + Shift + flecha izquierda o derecha.</small></div></div>
</template>

<template id="tplConsola">
<header class="c-top">
  <h1 class="c-brand">Consola del acto</h1>
  <span class="pill" id="conn">Pantalla del proyector cerrada</span>
  <button class="btn prim" id="abrir" type="button">Abrir pantalla del proyector</button>
</header>
<!-- arriba, lo que se mira y se toca en vivo; abajo, lo que se prepara -->
<div class="c-now">
  <section class="panel onair" aria-live="polite">
    <h2>Al aire</h2>
    <div class="now-row">
      <span class="thumb grande" id="airThumb" hidden></span>
      <div class="now-txt">
        <p class="big-name" id="airName">Fondos</p>
        <p class="sub" id="airSub">Sin fondos cargados</p>
      </div>
    </div>
    <div class="seek" id="airSeek" role="slider" aria-label="Posición del video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"><i id="airBar"></i></div><span class="tip"></span></div>
    <div class="times"><span id="airT">—</span><b id="airLeft">—</b></div>
  </section>
  <section class="panel nextp">
    <h2>Siguiente · <span class="kbd">Espacio</span></h2>
    <div class="now-row">
      <span class="thumb" id="nextThumb" hidden></span>
      <div class="now-txt">
        <p class="big-name" id="nextName">Sin contenidos cargados</p>
        <p class="sub" id="nextSub">Cargá una carpeta con videos, imágenes o música.</p>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>Música</h2>
    <p class="big-name" id="musName" style="font-size:16px">Sin música</p>
    <div class="seek" id="musSeek" role="slider" aria-label="Posición de la música" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"><i id="musBar" style="background:var(--c-gold)"></i></div><span class="tip"></span></div>
    <div class="times"><span id="musT">—</span><b id="musLeft" style="font-size:16px">—</b></div>
    <div class="load" style="margin-top:10px"><button class="btn" id="musLoop" type="button" aria-pressed="false">Repetir · R</button><button class="btn" id="musStop" type="button">Cortar música · S</button></div>
  </section>
  <section class="panel">
    <h2>Volumen</h2>
    <div class="vol"><input type="range" id="vol" min="0" max="100" value="100" aria-label="Volumen general"><b id="volV">100%</b></div>
  </section>
</div>
<div class="c-grid">
  <main class="c-col">
    <section class="panel">
      <h2>Programa</h2>
      <div class="load">
        <label class="btn" for="inDir">Elegir carpeta<input type="file" id="inDir" webkitdirectory multiple></label>
        <label class="btn" for="inFiles">Agregar archivos<input type="file" id="inFiles" multiple accept="video/*,image/*,audio/*,.mkv,.mov"></label>
        <button class="btn" id="vaciar" type="button">Vaciar programa</button>
      </div>
      <p class="help">El orden inicial sigue el nombre de los archivos: nombralos <b>01 Bienvenida.mp4</b>, <b>02 Danza folklórica.mp4</b>… Al elegir la carpeta, el programa se arma de nuevo en el orden de los nombres. Todo lo que cargás y ajustás queda guardado en este navegador: al volver a abrir la consola, está como lo dejaste.</p>
      <div class="drop" id="drop">También podés arrastrar archivos acá.</div>
      <div class="list" id="list"></div>
    </section>
  </main>
  <aside class="c-col">
    <section class="panel" id="bgPanel">
      <h2>Fondos · <span class="kbd">F</span></h2>
      <div class="bgs">
        <button class="btn" data-bg="rotar" type="button">Rotación automática</button>
        <button class="btn" data-bg="negro" type="button">Negro · N</button>
      </div>
      <div class="load bgload">
        <label class="btn" for="bgDir">Elegir carpeta<input type="file" id="bgDir" webkitdirectory multiple></label>
        <label class="btn" for="bgFiles">Agregar archivos<input type="file" id="bgFiles" multiple accept="video/*,image/*,.mkv,.mov"></label>
        <button class="btn" id="bgVaciar" type="button">Quitar agregados</button>
      </div>
      <p class="help">Tocá un fondo para dejarlo fijo. <b>↻</b> indica si entra en la rotación automática. También podés arrastrar imágenes o videos sobre este panel.</p>
      <div class="bglist" id="bgList"></div>
      <div class="timing">
        <label for="inFondo">Cada fondo dura</label>
        <div class="step"><button class="btn" type="button" data-step="fondo" data-d="-10" aria-label="Menos tiempo por fondo">−</button><input type="number" id="inFondo" min="5" max="1800" step="5" inputmode="numeric"><span>s</span><button class="btn" type="button" data-step="fondo" data-d="10" aria-label="Más tiempo por fondo">+</button></div>
        <label for="inFade">Fundido entre fondos</label>
        <div class="step"><button class="btn" type="button" data-step="fade" data-d="-0.5" aria-label="Fundido más corto">−</button><input type="number" id="inFade" min="0.2" max="8" step="0.1" inputmode="decimal"><span>s</span><button class="btn" type="button" data-step="fade" data-d="0.5" aria-label="Fundido más largo">+</button></div>
        <p class="nextchg" id="nextChg">—</p>
      </div>
    </section>
    <section class="panel">
      <h2>Teclas</h2>
      <dl class="keys">
        <dt><span class="kbd">Espacio</span></dt><dd>Lanzar el siguiente</dd>
        <dt><span class="kbd">↑</span> <span class="kbd">↓</span></dt><dd>Elegir cuál es el siguiente</dd>
        <dt><span class="kbd">1</span>–<span class="kbd">9</span></dt><dd>Lanzar directo ese número</dd>
        <dt><span class="kbd">F</span></dt><dd>Volver a los fondos</dd>
        <dt><span class="kbd">N</span></dt><dd>Negro</dd>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MODO_PANTALLA = location.hash === '#pantalla';
  if (MODO_PANTALLA) pantalla(); else consola();

  // =====================================================================
  //  PANTALLA DEL PROYECTOR
  // =====================================================================
  function pantalla() {
    document.body.className = 'pantalla';
    document.title = 'Proyector · Consola del acto';
    document.body.appendChild($('tplPantalla').content.cloneNode(true));
    const CONFIG = { fondoSeg: 60, fadeSeg: 1.8 };
    // rotación: 'u:<id>' de las imágenes y videos que se agregan como fondos desde la consola
    let rot = [], bgKinds = {}, curKey = null, uSlot = 'u2';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mus = $('mus');

    // ----- escenas -----
    const slot = id => { const el = $(id); return { el, blur: el.querySelector('img.blur'), img: el.querySelector('img.main'), v: el.querySelector('video') }; };
    const M = { m1: slot('sM1'), m2: slot('sM2') }, U = { u1: slot('sU1'), u2: slot('sU2') };
    const scenes = { m1: { el: M.m1.el }, m2: { el: M.m2.el }, u1: { el: U.u1.el }, u2: { el: U.u2.el }, negro: { el: $('sN') } };
    const files = new Map();       // id -> { file, url }
    let current = null, mode = 'fondos', rotar = true, idx = 0, timer = null;
    let activeSlot = 'm2', cue = null, vol = 1;
    let musId = null, musLabel = '';
    const FADE_MS = 1800;

    const urlFor = id => { const f = files.get(id); if (!f) return null; if (!f.url) f.url = URL.createObjectURL(f.file); return f.url; };
    function ramp(el, to, ms, done) {
      const from = el.volume, t0 = performance.now();
      cancelAnimationFrame(el._ramp);
      const step = now => {
        const k = Math.min(1, (now - t0) / ms);
        el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
        if (k < 1) el._ramp = requestAnimationFrame(step); else if (done) done();
      };
      el._ramp = requestAnimationFrame(step);
    }
    function show(name, fade) {
      document.documentElement.style.setProperty('--fade', (fade || CONFIG.fadeSeg) + 's');
      clearTimeout(timer);
      const prev = current;
      current = name;
      for (const [k, s] of Object.entries(scenes)) s.el.classList.toggle('on', k === name);
      // apagar lo que sale
      if (prev && prev !== name) {
        if (M[prev]) { const v = M[prev].v; if (!v.paused) ramp(v, 0, FADE_MS * .8, () => v.pause()); }
        if (U[prev]) { const v = U[prev].v; setTimeout(() => { if (current !== prev) v.pause(); }, CONFIG.fadeSeg * 1000 + 200); }
      }
      schedule();
    }
    let nextAt = 0, startedAt = 0;
    function schedule(ms) {
      clearTimeout(timer); nextAt = 0;
      if (mode === 'fondos' && rotar && curKey) {
        if (ms === undefined) { ms = CONFIG.fondoSeg * 1000; startedAt = performance.now(); }
        nextAt = performance.now() + ms; timer = setTimeout(nextFondo, ms);
      }
    }
    function setConfig(c) {
      if (c.fondoSeg) CONFIG.fondoSeg = Math.max(5, Math.min(1800, +c.fondoSeg));
      if (c.fadeSeg) CONFIG.fadeSeg = Math.max(.2, Math.min(8, +c.fadeSeg));
      // si cambia la duración con un fondo en pantalla, se respeta lo que ya lleva mostrado
      if (nextAt) schedule(Math.max(1000, startedAt + CONFIG.fondoSeg * 1000 - performance.now()));
    }
    const okKey = k => !!k && k.startsWith('u:') && !!(bgKinds[k.slice(2)] && files.has(k.slice(2)));
    function showBg(key) {
      // sin fondos cargados, la pantalla queda en negro
      if (!okKey(key)) { curKey = null; return show('negro'); }
      curKey = key;
      const id = key.slice(2), url = urlFor(id), name = uSlot === 'u1' ? 'u2' : 'u1', s = U[name];
      uSlot = name;
      if (bgKinds[id] === 'image') {
        s.v.pause(); s.v.loop = false; s.v.removeAttribute('src'); s.v.load(); s.v.hidden = true;
        s.img.hidden = false; s.blur.hidden = false; s.img.src = url; s.blur.src = url;
        s.img.classList.remove('kb'); s.blur.classList.remove('kb'); void s.img.offsetWidth;
        if (!reduce) { s.img.classList.add('kb'); s.blur.classList.add('kb'); }
      } else {
        s.img.hidden = true; s.blur.hidden = true; s.img.removeAttribute('src'); s.blur.removeAttribute('src');
        s.v.hidden = false; s.v.muted = true;
        if (s.v.dataset.id !== id) { s.v.src = url; s.v.dataset.id = id; }
        try { s.v.currentTime = 0; } catch (e) {}
        s.v.play().catch(() => {});
      }
      show(name);
    }
    function nextFondo() {
      const list = rot.filter(okKey);
      if (!list.length || (list.length === 1 && list[0] === curKey)) return schedule();
      idx = (list.indexOf(curKey) + 1) % list.length;
      showBg(list[idx]);
    }
    function fondos(which, rotFlag) {
      mode = 'fondos'; cue = null;
      if (typeof rotFlag === 'boolean') rotar = rotFlag;
      const list = rot.filter(okKey);
      if (which) return showBg(which);
      // al volver a la rotación se sigue desde el último fondo mostrado
      showBg(list.includes(curKey) ? curKey : list[0]);
    }
    function setBgList(d) {
      rot = Array.isArray(d.rot) ? d.rot : rot; bgKinds = d.kinds || {};
      // si se quitó el fondo que estaba al aire, o no había ninguno y llegó el primero, mostrar uno ya
      if (mode === 'fondos' && !okKey(curKey)) { curKey = null; fondos(null, true); }
      else if (mode === 'fondos' && rotar && !nextAt) schedule();
    }
    function negro() { mode = 'negro'; cue = null; show('negro', 1.2); }

    function lanzar(c) {
      const url = urlFor(c.id);
      if (!url) return;
      if (c.kind === 'audio') return playMusic(c.id, c.label, !!c.loop);
      const name = activeSlot === 'm1' ? 'm2' : 'm1', s = M[name];
      s.v.onended = null; cancelAnimationFrame(s.v._ramp);
      if (c.kind === 'image') {
        s.v.pause(); s.v.removeAttribute('src'); s.v.load(); s.v.hidden = true;
        s.img.hidden = false; s.blur.hidden = false; s.img.src = url; s.blur.src = url;
      } else {
        s.img.hidden = true; s.blur.hidden = true; s.img.removeAttribute('src'); s.blur.removeAttribute('src');
        s.v.hidden = false; s.v.src = url; s.v.loop = c.end === 'repetir'; s.v.muted = !c.sound; s.v.volume = c.sound ? vol : 0;
        try { s.v.currentTime = 0; } catch (e) {}
        const p = s.v.play();
        if (p) p.catch(() => { s.v.muted = true; s.v.play().catch(() => {}); });
        if (c.sound && !mus.paused) stopMusic();
        s.v.onended = () => {
          if (!cue || cue.slot !== name) return;
          const fin = cue.end;
          if (fin === 'negro') negro();
          else if (fin === 'fondos') fondos(null);
          else if (fin === 'siguiente') {
            // la consola sabe qué sigue; si no responde, volver a los fondos para no quedar en una imagen quieta
            send({ type: 'terminado', id: c.id });
            const slotAhora = name;
            setTimeout(() => { if (cue && cue.slot === slotAhora && cue.id === c.id) fondos(null); }, 1500);
          }
        };
      }
      s.el.classList.toggle('cover', c.fit === 'llenar');
      activeSlot = name; mode = 'media'; cue = { ...c, slot: name };
      show(name, 1);
    }
    function playMusic(id, label, loop) {
      const start = () => {
        mus.src = urlFor(id); mus.volume = vol; musId = id; musLabel = label; mus.loop = loop;
        mus.play().catch(() => {});
      };
      if (!mus.paused) ramp(mus, 0, 600, () => { mus.pause(); start(); }); else start();
    }
    function stopMusic() { if (!mus.paused) ramp(mus, 0, 1500, () => { mus.pause(); musId = null; }); else musId = null; }
    mus.addEventListener('ended', () => { musId = null; });
    function pausa() {
      const v = cue && cue.kind === 'video' ? M[cue.slot].v : null;
      if (v) { v.paused ? v.play().catch(() => {}) : v.pause(); return; }
      if (musId) mus.paused ? mus.play().catch(() => {}) : mus.pause();
    }
    function setVol(x) {
      vol = Math.max(0, Math.min(1, x));
      mus.volume = vol;
      if (cue && cue.kind === 'video' && cue.sound) M[cue.slot].v.volume = vol;
    }

    // ----- comunicación con la consola -----
    const consola = window.opener;
    const send = m => { try { consola && !consola.closed && consola.postMessage(m, '*'); } catch (e) {} };
    addEventListener('message', e => {
      if (e.source !== consola) return;
      const d = e.data || {};
      if (d.type === 'files') for (const f of d.items) { if (!files.has(f.id)) files.set(f.id, { file: f.file }); }
      else if (d.type === 'cmd') {
        if (d.cmd === 'cue') lanzar(d.cue);
        else if (d.cmd === 'config') setConfig(d);
        else if (d.cmd === 'bgList') setBgList(d);
        else if (d.cmd === 'cueUpdate' && cue && cue.id === d.id) {
          if (d.end) { cue.end = d.end; if (cue.kind === 'video') M[cue.slot].v.loop = d.end === 'repetir'; }
          if (d.fit) { cue.fit = d.fit; M[cue.slot].el.classList.toggle('cover', d.fit === 'llenar'); }
          if (typeof d.sound === 'boolean' && cue.kind === 'video') {
            cue.sound = d.sound; const v = M[cue.slot].v;
            cancelAnimationFrame(v._ramp); v.muted = !d.sound; v.volume = d.sound ? vol : 0;
            if (d.sound && !mus.paused) stopMusic();
          }
        }
        else if (d.cmd === 'fondos') fondos(d.which, d.rotar);
        else if (d.cmd === 'negro') negro();
        else if (d.cmd === 'pausa') pausa();
        else if (d.cmd === 'seek' || d.cmd === 'nudge') {
          const el = d.target === 'music' ? (musId ? mus : null) : (cue && cue.kind === 'video' ? M[cue.slot].v : null);
          if (el && isFinite(el.duration)) {
            const to = d.cmd === 'seek' ? d.frac * el.duration : el.currentTime + d.delta;
            el.currentTime = Math.max(0, Math.min(el.duration - .05, to));
            if (el.ended || (el === mus && el.paused && musId)) el.play().catch(() => {});
          }
        }
        else if (d.cmd === 'stopMusic') stopMusic();
        else if (d.cmd === 'loopMusic') mus.loop = !!d.v;
        else if (d.cmd === 'vol') setVol(d.v);
      }
    });
    setInterval(() => {
      const v = cue && cue.kind === 'video' ? M[cue.slot].v : null;
      send({ type: 'estado', mode, current: curKey, rotar, cueId: cue ? cue.id : null, kind: cue ? cue.kind : null,
        t: v ? v.currentTime : 0, dur: v && isFinite(v.duration) ? v.duration : 0, paused: v ? v.paused : false, ended: v ? v.ended : false,
        mus: musId ? { id: musId, label: musLabel, t: mus.currentTime, dur: isFinite(mus.duration) ? mus.duration : 0, paused: mus.paused, loop: mus.loop } : null,
        activo: !!(navigator.userActivation && navigator.userActivation.hasBeenActive) || document.body.classList.contains('listo'),
        full: !!document.fullscreenElement, fondoSeg: CONFIG.fondoSeg, fadeSeg: CONFIG.fadeSeg,
        nextIn: nextAt ? Math.max(0, (nextAt - performance.now()) / 1000) : null });
    }, 250);
    addEventListener('keydown', e => {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      send({ type: 'tecla', key: e.key });
    });
    const arr = $('arranque');
    if (!consola) $('arrTxt').textContent = 'Esta ventana se abre desde la consola: abrí el archivo y usá el botón "Abrir pantalla del proyector".';
    arr.addEventListener('click', () => {
      document.body.classList.add('listo');
      try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    });
    addEventListener('dblclick', () => {
      try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); } catch (e) {}
    });
    let idle; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2000); };
    addEventListener('mousemove', wake); wake();
    const lock = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} };
    lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock());
    addEventListener('beforeunload', e => { if (consola && !consola.closed) { e.preventDefault(); e.returnValue = ''; } });

    fondos(null, true);
    send({ type: 'hola' });
  }

  // =====================================================================
  //  CONSOLA
  // =====================================================================
  function consola() {
    document.body.className = 'consola';
    document.body.appendChild($('tplConsola').content.cloneNode(true));
    const KEY = 'consola-acto:programa';
    const VIDEO_EXT = /\.(mp4|webm|mov|m4v|mkv|ogv)$/i, IMG_EXT = /\.(jpe?g|png|webp|gif|bmp|avif)$/i, AUD_EXT = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus)$/i;
    let items = [], sel = 0, win = null, est = null, lastEst = 0, vol = 1;
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
    saved.items = saved.items || {}; saved.order = saved.order || [];
    saved.config = Object.assign({ fondoSeg: 60, fadeSeg: 1.8 }, saved.config || {});
    // además de los ajustes, se guarda qué hay cargado (order: programa, fondos: fondos agregados) para recuperarlo al volver a abrir
    const persist = () => {
      saved.order = items.map(i => i.id);
      saved.fondos = bgUser.map(u => u.id);
      for (const i of items) saved.items[i.id] = { label: i.label, sound: i.sound, end: i.end, loop: i.loop, fit: i.fit };
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    };

    const toastEl = $('toast'); let tt;
    const toast = (m, bad) => { toastEl.textContent = m; toastEl.classList.toggle('bad', !!bad); toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1800); };
    const fmt = s => { if (!isFinite(s) || s <= 0) return '0:00'; s = Math.round(s); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
    const kindOf = f => {
      const t = f.type || '';
      if (t.startsWith('video/') || VIDEO_EXT.test(f.name)) return 'video';
      if (t.startsWith('image/') || IMG_EXT.test(f.name)) return 'image';
      if (t.startsWith('audio/') || AUD_EXT.test(f.name)) return 'audio';
      return null;
    };
    const cleanName = n => n.replace(/\.[^.]+$/, '').replace(/^\s*\d+\s*[-_.)]*\s*/, '').replace(/[_]+/g, ' ').trim() || n;
    const KIND_TXT = { video: 'Video', image: 'Imagen', audio: 'Música' };

    // ----- memoria: copia de los archivos cargados en el navegador (IndexedDB) -----
    // Así, al volver a abrir la consola, el programa y los fondos están como se dejaron, sin elegir nada.
    // Cada archivo se guarda una vez por su firma, aunque esté en el programa y en los fondos.
    const firma = f => f.name + '|' + f.size + '|' + f.lastModified;
    let base = null;
    const abrirBase = () => base || (base = new Promise((ok, mal) => {
      const r = indexedDB.open('consola-acto', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('archivos');
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    }));
    // fn recibe el almacén dentro de una transacción; la promesa se resuelve cuando la transacción termina
    const transaccion = (modo, fn) => abrirBase().then(db => new Promise((ok, mal) => {
      const t = db.transaction('archivos', modo), salida = fn(t.objectStore('archivos'));
      t.oncomplete = () => ok(salida); t.onerror = t.onabort = () => mal(t.error);
    }));
    const recordar = list => transaccion('readwrite', st => { for (const x of list) st.put(x.file, firma(x.file)); })
      .catch(() => toast('No hay lugar en el navegador para recordar todos los archivos: la próxima vez vas a tener que cargar algunos de nuevo', true));
    // borra las copias que ya no usan ni el programa ni los fondos
    const olvidar = () => transaccion('readwrite', st => {
      const enUso = new Set([...items, ...bgUser].map(x => firma(x.file))), r = st.getAllKeys();
      r.onsuccess = () => { for (const k of r.result) if (!enUso.has(k)) st.delete(k); };
    }).catch(() => {});
    // al abrir la consola: vuelve a armar el programa y los fondos que había, en el mismo orden
    function recuperar() {
      const prog = saved.order || [], fon = saved.fondos || [];
      if (!prog.length && !fon.length) return;
      transaccion('readonly', st => {
        const ks = st.getAllKeys(), vs = st.getAll(), m = new Map();
        vs.onsuccess = () => ks.result.forEach((k, i) => m.set(k, vs.result[i]));
        return m;
      }).then(m => {
        if (items.length || bgUser.length) return;   // ya se cargó otra cosa mientras tanto
        items = prog.map(id => m.get(id)).filter(Boolean).map(nuevoItem).filter(Boolean);
        bgUser = fon.map(id => m.get(id.replace(/^bg\|/, ''))).filter(Boolean).map(nuevoFondo).filter(Boolean);
        for (const it of items) analyze(it);
        for (const u of bgUser) analyze(u, () => renderBg());
        const perdidos = prog.length + fon.length - items.length - bgUser.length;
        persist(); render(); renderBg(); sendFiles(items); sendBg();
        if (items.length || bgUser.length) toast('Se recuperó lo que habías cargado' + (perdidos ? ` (${perdidos} ${perdidos === 1 ? 'archivo ya no estaba' : 'archivos ya no estaban'})` : ''), perdidos > 0);
      }).catch(() => {});
    }

    // ----- carga de archivos -----
    // replace = true (Elegir carpeta): la carpeta reemplaza el programa y el orden es el de los nombres de archivo
    function addFiles(list, replace) {
      const fresh = [];
      const nuevos = [...list].filter(f => kindOf(f));
      if (replace && nuevos.length) { items = []; sel = 0; }
      for (const f of list) {
        const it = nuevoItem(f);
        if (it && !items.some(i => i.id === it.id)) fresh.push(it);
      }
      if (!fresh.length) { toast('No encontré videos, imágenes ni música nuevos', true); return; }
      fresh.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }));
      items = items.concat(fresh);
      for (const it of fresh) analyze(it);
      persist(); recordar(fresh); if (replace) olvidar(); sendFiles(fresh); render();
      toast(replace ? 'Programa cargado: ' + fresh.length + ' contenidos, en el orden de los nombres' : fresh.length + (fresh.length === 1 ? ' contenido agregado' : ' contenidos agregados'));
    }
    // contenido del programa a partir de un archivo, con los ajustes que tenía guardados
    function nuevoItem(f) {
      const kind = kindOf(f); if (!kind) return null;
      const id = firma(f), s = saved.items[id] || {};
      return { id, file: f, kind, name: f.name, label: s.label || cleanName(f.name),
        sound: s.sound !== undefined ? s.sound : true, end: s.end || 'fondos', loop: !!s.loop, fit: s.fit || 'entera', dur: 0, thumb: '' };
    }
    function analyze(it, upd) {
      upd = upd || renderRow;
      const url = URL.createObjectURL(it.file);
      if (it.kind === 'image') { it.thumb = url; return; }
      const el = document.createElement(it.kind === 'video' ? 'video' : 'audio');
      el.preload = 'metadata'; el.muted = true; el.src = url;
      el.addEventListener('loadedmetadata', () => {
        it.dur = el.duration; upd(it);
        if (it.kind === 'video') { try { el.currentTime = Math.min(1.5, el.duration / 3); } catch (e) {} }
      });
      el.addEventListener('seeked', () => {
        try {
          const c = document.createElement('canvas'); c.width = 160; c.height = 90;
          const x = c.getContext('2d'), r = Math.max(160 / el.videoWidth, 90 / el.videoHeight);
          const w = el.videoWidth * r, h = el.videoHeight * r;
          x.drawImage(el, (160 - w) / 2, (90 - h) / 2, w, h);
          it.thumb = c.toDataURL('image/jpeg', .7); upd(it);
        } catch (e) {}
        el.removeAttribute('src'); el.load();
      });
      el.addEventListener('error', () => { it.err = true; upd(it); });
    }
    $('inDir').addEventListener('change', e => { addFiles(e.target.files, true); e.target.value = ''; });
    $('inFiles').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
    const drop = $('drop');
    const overBg = e => !!(e.target && e.target.closest && e.target.closest('#bgPanel'));
    addEventListener('dragover', e => {
      e.preventDefault(); const bg = overBg(e);
      $('bgPanel').classList.toggle('over', bg); drop.hidden = bg && items.length > 0; drop.classList.toggle('over', !bg);
    });
    addEventListener('dragleave', e => { if (!e.relatedTarget) { drop.classList.remove('over'); $('bgPanel').classList.remove('over'); drop.hidden = items.length > 0; } });
    addEventListener('drop', e => {
      e.preventDefault(); const bg = overBg(e);
      drop.classList.remove('over'); $('bgPanel').classList.remove('over'); drop.hidden = items.length > 0;
      if (e.dataTransfer.files.length) bg ? addBg(e.dataTransfer.files) : addFiles(e.dataTransfer.files);
    });
    $('vaciar').addEventListener('click', () => {

      if (send({ type: 'cmd', cmd: 'loopMusic', v })) {
        m.loop = v; updateAir();
        const it = items.find(i => i.id === m.id); if (it) { it.loop = v; persist(); render(); }
        toast(v ? 'La música se va a repetir' : 'La música termina y no se repite');
      }
    }
    $('musLoop').addEventListener('click', toggleLoop);
    const volIn = $('vol');
    function setVol(v) {
      vol = Math.max(0, Math.min(1, Math.round(v * 100) / 100));
      volIn.value = Math.round(vol * 100); $('volV').textContent = Math.round(vol * 100) + '%';
      if (win && !win.closed) try { win.postMessage({ type: 'cmd', cmd: 'vol', v: vol }, '*'); } catch (e) {}
    }
    volIn.addEventListener('input', () => setVol(volIn.value / 100));
    volIn.addEventListener('change', () => volIn.blur());
    // tras un clic con el mouse, soltar el foco para que Espacio siempre lance el siguiente
    document.addEventListener('click', e => { const b = e.target.closest('button, summary'); if (b && e.detail > 0) b.blur(); });

    function handleKey(key) {
      const k = key.length === 1 ? key.toLowerCase() : key;
      if (k === ' ') { if (sel < items.length) fire(sel); else toast('No hay más contenidos en el programa', true); }
      else if (k === 'ArrowDown') { sel = Math.min(items.length, sel + 1); render(); }
      else if (k === 'ArrowRight') nudge(5);
      else if (k === 'ArrowLeft') nudge(-5);
      else if (k === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); }
      else if (/^[1-9]$/.test(k)) fire(+k - 1);
      else if (k === 'f') fondos('rotar');
      else if (k === 'n') fondos('negro');
      else if (k === 'p') send({ type: 'cmd', cmd: 'pausa' });
      else if (k === 'r') toggleLoop();
      else if (k === 's') { send({ type: 'cmd', cmd: 'stopMusic' }) && toast('Cortando la música'); }
      else if (k === '+' || k === '=') { setVol(vol + .1); toast('Volumen ' + Math.round(vol * 100) + '%'); }
      else if (k === '-' || k === '_') { setVol(vol - .1); toast('Volumen ' + Math.round(vol * 100) + '%'); }
      else return false;
      return true;
    }
    addEventListener('keydown', e => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' && e.target.type !== 'range' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (handleKey(e.key)) e.preventDefault();
    });
    addEventListener('beforeunload', e => { if (alive()) { e.preventDefault(); e.returnValue = ''; } });
    // ----- tiempos de los fondos -----
    const inFondo = $('inFondo'), inFade = $('inFade');
    const fmtNum = v => String(Math.round(v * 10) / 10).replace('.', ',');
    function showConfig() { inFondo.value = saved.config.fondoSeg; inFade.value = saved.config.fadeSeg; }
    function sendConfig() { if (win && !win.closed) try { win.postMessage({ type: 'cmd', cmd: 'config', fondoSeg: saved.config.fondoSeg, fadeSeg: saved.config.fadeSeg }, '*'); } catch (e) {} }
    function setTiming(key, v, quiet) {
      if (!isFinite(v)) { showConfig(); return; }
      if (key === 'fondoSeg') v = Math.max(5, Math.min(1800, Math.round(v)));
      else v = Math.max(.2, Math.min(8, Math.round(v * 10) / 10));
      saved.config[key] = v; persist(); showConfig(); sendConfig();
      if (!quiet) toast(key === 'fondoSeg' ? 'Cada fondo dura ' + v + ' s' : 'Fundido de ' + fmtNum(v) + ' s');
    }
    for (const b of document.querySelectorAll('[data-step]')) b.addEventListener('click', () => {
      const key = b.dataset.step === 'fondo' ? 'fondoSeg' : 'fadeSeg';
      setTiming(key, saved.config[key] + parseFloat(b.dataset.d));
    });
    inFondo.addEventListener('change', () => { setTiming('fondoSeg', parseFloat(inFondo.value)); inFondo.blur(); });
    inFade.addEventListener('change', () => { setTiming('fadeSeg', parseFloat(String(inFade.value).replace(',', '.'))); inFade.blur(); });
    for (const el of [inFondo, inFade]) el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    function updateNextChg() {
      const n = $('nextChg');
      if (!alive() || !est) { n.textContent = 'Se aplica al conectar la pantalla del proyector.'; return; }
      if (est.mode !== 'fondos') n.textContent = 'Los fondos no están al aire.';
      else if (!est.rotar) n.textContent = 'Fondo fijo: no cambia solo.';
      else if (est.nextIn != null) n.innerHTML = 'Próximo cambio en <b>' + fmt(est.nextIn) + '</b>';
      else n.textContent = '—';
    }
    showConfig(); updateNextChg();
    renderBg();
    wireSeek('airSeek', 'airBar', 'air', 'video', () => (est && est.dur) || 0);
    wireSeek('musSeek', 'musBar', 'mus', 'music', () => (est && est.mus && est.mus.dur) || 0);
    render();
    recuperar();
  }
})();
</script>
