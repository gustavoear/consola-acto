<!-- los textos con data-ev y los aria-label / alt se completan desde evento.json -->
<section class="scene" id="sB" data-tipo="escudo">
  <canvas id="cB"></canvas>
  <div class="b-stage">
    <img class="crest" id="crest" src="__ESCUDO__" alt="">
    <div class="b-copy txt">
      <div class="big" data-ev-si="numero"><span class="num" data-ev="numero"></span><span class="anos" data-ev="unidad"></span></div>
      <div class="rule"></div>
      <p class="years" data-ev="anios"></p>
      <p class="lema" data-ev="lema"></p>
    </div>
  </div>
</section>

<section class="scene" id="sV" data-tipo="video">
  <video id="vid" muted playsinline preload="auto"></video>
  <div class="vignette"></div>
  <!-- rótulos del video: se agregan desde fondos[].rotulos -->
</section>

<section class="scene" id="sA" data-tipo="aniversario">
  <canvas id="cA"></canvas>
  <div class="a-stage">
    <div class="a-emblem txt">
      <p class="inst" data-ev="institucion"></p>
      <div class="big" data-ev-si="numero"><span class="num" data-ev="numero"></span><span class="anos" data-ev="unidad"></span></div>
      <p class="years" data-ev="anios"></p>
      <p class="lema" data-ev="lema"></p>
    </div>
  </div>
</section>

<section class="scene" id="sL" data-tipo="logo">
  <canvas id="cL"></canvas>
  <div class="l-stage">
    <img class="logo70" id="logo70" src="__LOGO__" alt="">
  </div>
</section>

<section class="scene" id="sS" data-tipo="bordado">
  <canvas id="cS"></canvas>
  <div class="s-stage">
    <img class="sokoly" id="sokoly" src="__BORDADO__" alt="">
  </div>
</section>
