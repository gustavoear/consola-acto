<!-- un molde por tipo de fondo: la pantalla clona uno por cada fondo de evento.json.
     Los textos con data-ev, la imagen, el video y los rótulos se completan desde la configuración. -->
<section class="scene" data-tipo="escudo">
  <canvas></canvas>
  <div class="b-stage">
    <img class="escudo-img" alt="">
    <div class="b-copy txt">
      <div class="big" data-ev-si="numero"><span class="num" data-ev="numero"></span><span class="anos" data-ev="unidad"></span></div>
      <div class="rule"></div>
      <p class="years" data-ev="anios"></p>
      <p class="lema" data-ev="lema"></p>
    </div>
  </div>
</section>

<section class="scene s-video" data-tipo="video">
  <video muted playsinline preload="auto"></video>
  <div class="vignette"></div>
</section>

<section class="scene" data-tipo="aniversario">
  <canvas></canvas>
  <div class="a-stage">
    <div class="a-emblem txt">
      <p class="inst" data-ev="institucion"></p>
      <div class="big" data-ev-si="numero"><span class="num" data-ev="numero"></span><span class="anos" data-ev="unidad"></span></div>
      <p class="years" data-ev="anios"></p>
      <p class="lema" data-ev="lema"></p>
    </div>
  </div>
</section>

<section class="scene" data-tipo="logo">
  <canvas></canvas>
  <div class="l-stage">
    <img class="logo-img" alt="">
  </div>
</section>

<section class="scene" data-tipo="bordado">
  <canvas></canvas>
  <div class="s-stage">
    <img class="bordado-img" alt="">
  </div>
</section>
